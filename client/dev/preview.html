<!doctype html><html><body style="margin:0;background:#4a3c64">
<canvas id="c" width="1320" height="660"></canvas>
<script type="module">
import { humanSheet, lookFor } from '../src/art/chars.js';
const c = document.getElementById('c'), g = c.getContext('2d');
g.imageSmoothingEnabled = false;
const pick = [0,2,4,6,7,9,10,12,16,17];
['warrior','engineer','gunman','mage','savage'].forEach((cl,i)=>{
  const sh = humanSheet(lookFor(cl)).canvas();
  pick.forEach((f,j)=> g.drawImage(sh, f*32,0,32,32, j*130, i*130, 128, 128));
});
</script></body></html>
